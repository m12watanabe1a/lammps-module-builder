version: "3"

vars:
  CATEGORY: "stable"
  DATE: "22Jul2025_update6"
  VERSION: "{{.CATEGORY}}_{{.DATE}}"
  SRC_DIR: "{{.TASKFILE_DIR}}/tmp/src/lammps-src-{{.VERSION}}"
  TAR_FILE: "{{.TASKFILE_DIR}}/tmp/downloads/lammps-src-{{.VERSION}}.tar.gz"
  PREFIX: "{{.HOME}}/.local/opt/lammps/{{.VERSION}}"

tasks:
  all:
    desc: "Build and install LAMMPS from source"
    deps:
      - task: install

  build:
    desc: "Configure and compile LAMMPS"
    deps:
      - task: cmake_build

  install:
    desc: "Install LAMMPS binaries and Python package"
    deps:
      - task: set_rpath

  download:
    status:
      - test -f "{{.TAR_FILE}}"
    generates:
      - "{{.TAR_FILE}}"
    cmds:
      - mkdir -p "{{.TAR_FILE | dir}}"
      - curl -L -o "{{.TAR_FILE}}"
        "https://github.com/lammps/lammps/releases/download/{{.VERSION}}/lammps-src-{{.DATE}}.tar.gz"

  verify:
    deps:
      - task: download
    vars:
      CHECKSUM_FILE: "{{.TASKFILE_DIR}}/checksums/lammps-src-{{.DATE}}.tar.gz.sha256"
    cmds:
      - cmd: >
          "{{.TASKFILE_DIR}}/scripts/verify.sh"
          "{{.CHECKSUM_FILE}}"
          "{{.TAR_FILE}}"
  
  extract:
    deps:
      - task: verify
    sources:
      - "{{.TAR_FILE}}"
    generates:
      - "{{.SRC_DIR}}/README"
    cmds:
      - mkdir -p "{{.SRC_DIR}}"
      - tar -xzf "{{.TAR_FILE}}" -C "{{.SRC_DIR}}" --strip-components=1

  apply_patches:
    deps:
      - task: extract
    sources:
      - "{{.SRC_DIR}}/README"
    generates:
      - "{{.SRC_DIR}}/PATCHES_APPLIED"
    dir: "{{.SRC_DIR}}"
    cmds:
      - find "{{.TASKFILE_DIR}}/patch" -name "*.patch" -exec bash "{{.TASKFILE_DIR}}/scripts/apply-patch.sh" {} \;
      - touch "{{.SRC_DIR}}/PATCHES_APPLIED"

  cmake_configure:
    deps:
      - task: apply_patches
    vars:
      CMAKE_PRESETS_FILE:
        sh: '"{{.TASKFILE_DIR}}/scripts/resolve-file.sh" "{{.TASKFILE_DIR}}/config/CMakePresets.json"'
    sources:
      - "{{.SRC_DIR}}/CMakeLists.txt"
      - "{{.CMAKE_PRESETS_FILE}}"
      - "{{.TASKFILE_DIR}}/scripts/resolve-file.sh"
    generates:
      - "{{.SRC_DIR}}/build/CMakeCache.txt"
    dir: "{{.SRC_DIR}}"
    cmds:
      - cp "{{.CMAKE_PRESETS_FILE}}" "{{.SRC_DIR}}/cmake/CMakePresets.json"
      - cmake 
        --fresh
        --preset release
        -S cmake
        -B build
        -D Python_EXECUTABLE=$(which python3)
        -D CMAKE_INSTALL_PREFIX="{{.PREFIX}}"

  cmake_build:
    deps:
      - task: cmake_configure
    sources:
      - "{{.SRC_DIR}}/build/CMakeCache.txt"
    generates:
      - "{{.SRC_DIR}}/build/lmp"
    dir: "{{.SRC_DIR}}"
    cmds:
      - cmake --build build

  cmake_install:
    deps:
      - task: cmake_build
    sources:
      - "{{.SRC_DIR}}/build/lmp"
    generates:
      - "{{.PREFIX}}/bin/lmp"
    dir: "{{.SRC_DIR}}"
    cmds:
      - cmake --install build

  set_rpath:
    deps:
      - task: pip_install
    status:
      - (test "$(uname -s)" != "Darwin") || (otool -l "{{.PREFIX}}/bin/lmp" | grep -q "path {{.PREFIX}}/lib")
    cmds:
      - install_name_tool -add_rpath "{{.PREFIX}}/lib" "{{.PREFIX}}/bin/lmp"

  python_install:
    deps:
      - task: cmake_install
    vars:
      PYTHON_VERSION:
        sh: 'python3 -c "import sys; print(f\"{sys.version_info.major}.{sys.version_info.minor}\")"'
      PYTHON_SITE_PACKAGES: "{{.PREFIX}}/lib/python{{.PYTHON_VERSION}}/site-packages"
    status:
      - test -n "$(find "{{.PYTHON_SITE_PACKAGES}}/lammps" -maxdepth 1 -name 'liblammps.*' -print -quit 2>/dev/null)"
    sources:
      - "{{.SRC_DIR}}/build/liblammps.*"
      - "{{.TASKFILE_DIR}}/scripts/install-python.sh"
    dir: "{{.SRC_DIR}}"
    env:
      PREFIX: "{{.PREFIX}}"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/install-python.sh"

  pip_install:
    deps:
      - task: python_install
    vars:
      PACKAGES_FILE:
        sh: '"{{.TASKFILE_DIR}}/scripts/resolve-file.sh" "{{.TASKFILE_DIR}}/config/requirements.txt"'
    cmds:
      - python3 -m pip install -r "{{.PACKAGES_FILE}}" --prefix "{{.PREFIX}}"
  